<button
  type="button"
  class="theme-toggle"
  (click)="toggleLightDark()"
  [attr.aria-label]="isDarkTheme ? 'Ativar tema claro' : 'Ativar tema escuro'"
  [title]="isDarkTheme ? 'Tema claro' : 'Tema escuro'"
>
  <i
    class="pi"
    [class.pi-sun]="isDarkTheme"
    [class.pi-moon]="!isDarkTheme"
    aria-hidden="true"
  ></i>
  @if (!compact) {
    <span>{{ isDarkTheme ? "Tema claro" : "Tema escuro" }}</span>
  }
</button>
