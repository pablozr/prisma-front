# Default HTTP site. Works standalone, without any TLS certificate.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routes (deep links) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Project cover images from the shared backend volume. No SPA fallback here.
    location /assets/project-covers/ {
        alias /srv/project-covers/;
        autoindex off;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Backend API. proxy_pass has no URI part so the whole request URI is
    # preserved (e.g. /api/v1/unirio/...). Docs, OpenAPI and auth live under
    # this same API location.
    location /api/ {
        proxy_pass http://prisma-api:5685;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
